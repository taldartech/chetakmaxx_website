<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gallery — Chetak Maxx applications, installations, and product on site." />
    <title>Gallery | Chetak Maxx Building Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      (function () {
        try {
          if (typeof tailwind === 'undefined') return;
          tailwind.config = {
        theme: {
          extend: {
            colors: {
              royal: { DEFAULT: '#0f2744', deep: '#0a1628', light: '#1a3a5c', darker: '#050d18' },
              brandcyan: { DEFAULT: '#00b8db', soft: '#22d3ee' },
              brandgold: { DEFAULT: '#c9a227', light: '#e8c547' },
            },
            fontFamily: {
              sans: ['Poppins', 'system-ui', 'sans-serif'],
              display: ['Montserrat', 'Poppins', 'sans-serif'],
            },
            boxShadow: { premium: '0 25px 50px -12px rgba(10, 22, 40, 0.45)', card: '0 10px 40px -10px rgba(15, 39, 68, 0.2)', glow: '0 0 40px rgba(0, 184, 219, 0.25)' },
          },
        },
      };
        } catch (e) {}
      })();
    </script>
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/custom.css" />
  </head>
  <body data-page="gallery" class="bg-slate-50 text-slate-800 antialiased">
    <div id="site-header"></div>
    <script src="assets/js/layout.js"></script>

    <main>
      <section class="hero-gradient hero-mesh relative overflow-hidden pt-32 pb-16 sm:pt-36 sm:pb-20">
        <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <p class="font-display text-sm font-bold uppercase tracking-widest text-brandgold" data-aos="fade-up">Visual proof</p>
          <h1 class="mt-3 font-display text-4xl font-extrabold tracking-tight text-white sm:text-5xl" data-aos="fade-up" data-aos-delay="50">Gallery</h1>
          <p class="mt-4 max-w-2xl text-lg text-white/75" data-aos="fade-up" data-aos-delay="100">
            Construction applications, product showcase, and site installations — see how Chetak Maxx performs in the field.
          </p>
        </div>
      </section>

      <section class="py-16 sm:py-24">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="columns-1 gap-4 sm:columns-2 lg:columns-3 lg:gap-6">
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/d9e87e3a-265a-457d-bef1-da1aa2bd1762.jpeg" alt="Site and application" class="w-full object-cover" width="900" height="1100" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Site & application</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/Multipurpose-front.jpg" alt="Multipurpose adhesive on site" class="w-full object-cover" width="800" height="800" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">On site</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/WhatsApp%20Image%202026-05-12%20at%201.10.32%20PM.jpeg" alt="Gallery" class="w-full object-cover" width="800" height="800" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Installation</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white p-6 shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/Wall-Floor-Front-Trans.png" alt="Wall Floor product" class="mx-auto w-full max-w-xs object-contain" width="400" height="520" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Wall & Floor — Blue</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white p-6 shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/Multipurpose-Front-Trans.png" alt="Multipurpose product" class="mx-auto w-full max-w-xs object-contain" width="400" height="520" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Multipurpose — Red</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white p-6 shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/Floor-front-trans.png" alt="Floor product" class="mx-auto w-full max-w-xs object-contain" width="400" height="520" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Floor — Brown / Gold</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/Wall-Floor-Front.jpg" alt="Wall Floor pack" class="w-full object-cover" width="800" height="700" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Product photography</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/Floor-Front.jpg" alt="Floor pack" class="w-full object-cover" width="800" height="700" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Floor line</figcaption>
            </figure>
            <figure class="mb-4 break-inside-avoid overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-slate-200/80" data-aos="fade-up">
              <img src="images/Multipurpose-front.jpg" alt="Multipurpose pack" class="w-full object-cover" width="800" height="700" loading="lazy" />
              <figcaption class="px-4 py-3 text-sm font-medium text-royal">Multipurpose line</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
